<body>
<main>
<header class="topbar">
  <a href="#/home" class="brand" aria-label="Plan X, главная">Plan X</a>
  <nav class="tools" aria-label="Настройки">
    <a class="tool" href="#/settings">Настройки</a>
    <details class="theme-menu">
      <summary class="tool">Тема <span aria-hidden="true">⌄</span></summary>
      <div class="theme-pick" aria-label="Выбор темы">
        <button type="button" data-theme="a" aria-pressed="false"><i></i>Два поля</button>
        <button type="button" data-theme="b" aria-pressed="true"><i></i>Карманные папки</button>
        <button type="button" data-theme="c" aria-pressed="false"><i></i>Рабочий круг</button>
      </div>
    </details>
  </nav>
</header>
<p class="notice">Демо с вымышленными заметками. Правки сохраняются в этом браузере.</p>
<p id="connection-status" class="notice" role="status"></p>
<section id="home">
  <header class="lead"><i class="orbit" aria-hidden="true"></i><h1>Задачи</h1></header>
  <div class="digest" id="digest" hidden></div>
  <div id="workspaces"></div>
</section>
<section id="files" hidden>
  <header class="lead"><h1>Проводник</h1></header>
  <label class="search">Поиск
    <input id="file-search" type="search" placeholder="По названию">
  </label>
  <div id="tree" class="tree"></div>
</section>
<section id="settings" hidden>
  <header class="lead"><h1>Настройки демо</h1></header>
  <form id="connect-form" hidden>
    <label>Адрес подключения <input id="connector" name="connector" type="url" required autocapitalize="off" spellcheck="false" placeholder="https://…"></label>
    <label>Код доступа <input name="code" type="password" required autocomplete="off"></label>
    <div class="bar">
      <button type="submit" id="connect">Подключиться</button>
      <button type="button" id="refresh" hidden>Обновить</button>
      <button type="button" id="demo">Открыть вымышленную базу</button>
    </div>
  </form>
  <p id="permission-status" class="notice"></p>
  <form id="folder-form" hidden>
    <label>Разрешённая папка <select id="folder-select" required></select></label>
    <div class="bar"><button type="submit">Выбрать папку</button></div>
  </form>
  <form id="digest-form" hidden>
    <label>Источник дайджеста <select id="digest-select"></select></label>
    <div class="bar"><button type="submit">Сохранить источник</button></div>
  </form>
</section>
<article id="note" class="note" hidden>
  <a id="note-back" class="back" href="#/home">К задачам</a>
  <h1 id="note-title"></h1>
  <p id="note-status" class="notice" role="status"></p>
  <div id="note-preview"></div>
  <textarea id="editor" aria-label="Текст заметки" rows="12" spellcheck="false" hidden></textarea>
  <section id="remote" hidden>
    <h2>Текущая версия на Диске</h2>
    <pre id="remote-text"></pre>
    <div class="bar"><button id="rebase" type="button">Я объединил правки</button></div>
  </section>
  <div class="bar">
    <button id="edit" type="button" hidden>Редактировать</button>
    <button id="save" type="button" hidden>Сохранить</button>
    <button id="review" type="button" hidden>Проверить на Диске</button>
    <button id="close-editor" type="button" hidden>К чтению</button>
    <button id="discard" type="button" hidden>Отменить свой черновик</button>
  </div>
</article>
</main>
<nav class="bottom-nav" aria-label="Основная навигация">

      </svg>
      <span>Проводник</span>
    </a>
  </div>
</nav>

  noteStatus("\u041E\u0431\u044A\u0435\u0434\u0438\u043D\u0451\u043D\u043D\u0430\u044F \u0432\u0435\u0440\u0441\u0438\u044F \u0433\u043E\u0442\u043E\u0432\u0430 \u043A \u0441\u043E\u0445\u0440\u0430\u043D\u0435\u043D\u0438\u044E.");
  noteControls(view);
};
by("save").onclick = async () => {
  const view = active;
  if (!view?.draft || view.needsReview || pendingWrites.has(draftKey(view))) return;
  const draft = view.draft;
  if (navigator.onLine === false) {
    noteStatus("\u041D\u0435\u0442 \u0441\u0435\u0442\u0438. \u041F\u0440\u0430\u0432\u043A\u0430 \u043D\u0435 \u0441\u043E\u0445\u0440\u0430\u043D\u0438\u043B\u0430\u0441\u044C. \u0427\u0435\u0440\u043D\u043E\u0432\u0438\u043A \u043E\u0441\u0442\u0430\u0451\u0442\u0441\u044F \u0432 \u0440\u0435\u0434\u0430\u043A\u0442\u043E\u0440\u0435.");
    return;
  }
  const pendingKey = draftKey(view);
  pendingWrites.add(pendingKey);
  noteControls(view);
  try {
    await view.connection.save(view.folder, view.id, draft);
    clearDraft(view);
    view.editing = false;
    if (active && draftKey(active) === pendingKey) {
      const shown = active;
      shown.draft = null;
      shown.editing = false;
      shown.snapshot = null;
      shown.saved = draft;
      const file = files.find((entry) => entry.id === shown.id && entry.type === "note");
      if (file) showNote(file, draft);
      noteControls(shown);
      noteStatus("\u0421\u043E\u0445\u0440\u0430\u043D\u0435\u043D\u043E.");
      await loadNote(shown);
    }
    if (connection === view.connection) void sync({ quiet: true });
  } catch (error) {
    view.needsReview = ["unknown", "auth", "conflict", "drive_auth"].includes(error?.code);
    if (active && draftKey(active) === pendingKey) {
      active.needsReview ||= view.needsReview;
      noteStatus(userError(error) + " \u0427\u0435\u0440\u043D\u043E\u0432\u0438\u043A \u0441\u043E\u0445\u0440\u0430\u043D\u0451\u043D \u0432 \u044D\u0442\u043E\u0439 \u0432\u043A\u043B\u0430\u0434\u043A\u0435.");
      if (error?.code === "conflict") await loadNote(active);
    }
  } finally {
    pendingWrites.delete(pendingKey);
    if (active && draftKey(active) === pendingKey) noteControls(active);
  }
};
window.addEventListener("hashchange", route);
window.addEventListener("online", () => sync({ quiet: true }));
document.addEventListener("visibilitychange", () => {

});
window.addEventListener("pageshow", (event) => {

});
window.setInterval(() => {
  if (!document.hidden && navigator.onLine !== false) void sync({ quiet: true });
}, 6e4);
window.addEventListener("beforeunload", (event) => {

});
async function start() {

}
await start().catch((error) => connectStatus(userError(error)));
await route();
